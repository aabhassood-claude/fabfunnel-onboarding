<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FabFunnel · Generating…</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="topbar">
    <div><span class="brand">FabFunnel</span><span class="brand__tag">GENIE</span></div>
    <div style="display:flex; align-items:center; gap:12px; font-size:13px;">
      <div class="credits-pill">
        <span class="credits-pill__bolt">⚡</span>
        <span class="credits-pill__count">38</span>
        <span class="credits-pill__label">credits</span>
      </div>
    </div>
  </div>

  <div class="page">
    <div class="processing">
      <div class="spinner"></div>
      <h1>Generating your creatives…</h1>
      <p class="sub">This usually takes 15–30 seconds. Feel free to grab a coffee ☕️</p>

      <div class="processing__steps" id="steps">
        <div class="processing__step active"><span class="processing__check"></span><span>Reading your brand & prompt</span></div>
        <div class="processing__step"><span class="processing__check"></span><span>Applying strategy & style</span></div>
        <div class="processing__step"><span class="processing__check"></span><span>Rendering 4 variations</span></div>
        <div class="processing__step"><span class="processing__check"></span><span>Saving to Gallery</span></div>
      </div>
    </div>
  </div>

  <div class="wf-banner">WIREFRAME · FLOW REVIEW</div>

  <script>
    const steps = document.querySelectorAll('.processing__step');
    const format = new URLSearchParams(location.search).get('format') || 'image';
    let i = 0;
    const iv = setInterval(() => {
      steps[i].classList.remove('active');
      steps[i].classList.add('done');
      i++;
      if (i < steps.length) {
        steps[i].classList.add('active');
      } else {
        clearInterval(iv);
        location.href = 'gallery.html?new=1&format=' + format;
      }
    }, 1000);
  </script>
</body>
</html>
