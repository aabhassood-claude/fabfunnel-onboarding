<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FabFunnel · Processing</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="topbar">
    <div><span class="brand">FabFunnel</span><span class="brand__tag">GENIE</span></div>
    <a href="#" style="font-size:13px; color:var(--muted);">Help</a>
  </div>

  <div class="page">
    <a href="#" id="backLink" class="back-link">← Back to Input</a>

    <div class="stepper">
      <div class="stepper__item done">Choose Mode</div>
      <div class="stepper__item done">Input</div>
      <div class="stepper__item current">Processing</div>
      <div class="stepper__item">Done</div>
    </div>

    <div class="processing">
      <div class="spinner"></div>
      <h1 id="title">Setting up your workspace…</h1>
      <p class="sub" id="subtitle">This usually takes 10–20 seconds.</p>

      <div class="processing__steps" id="steps">
        <div class="processing__step active" data-step="0"><span class="processing__check"></span><span>Fetching your inputs</span></div>
        <div class="processing__step" data-step="1"><span class="processing__check"></span><span>Analyzing brand & style</span></div>
        <div class="processing__step" data-step="2"><span class="processing__check"></span><span>Preparing templates</span></div>
        <div class="processing__step" data-step="3"><span class="processing__check"></span><span>Finalizing your brand profile</span></div>
      </div>
    </div>
  </div>

  <div class="wf-banner">WIREFRAME · FLOW REVIEW</div>

  <script>
    // Simulate progress so the flow can be clicked through
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode') || 'ecom';
    document.getElementById('backLink').href = 'input-' + mode + '.html';

    // Adjust copy and step labels based on mode
    const stepEls = document.querySelectorAll('.processing__step span:last-child');
    if (mode === 'affiliate') {
      document.getElementById('title').textContent = 'Analyzing your category…';
      document.getElementById('subtitle').textContent = 'We\'re pulling reference content, researching competitors, and detecting angles.';
      stepEls[0].textContent = 'Reading your category & platforms';
      stepEls[1].textContent = 'Analyzing reference URLs & competitors';
      stepEls[2].textContent = 'Detecting angles & keywords';
      stepEls[3].textContent = 'Finalizing your category profile';
    }

    const steps = document.querySelectorAll('.processing__step');
    let i = 0;
    const iv = setInterval(() => {
      steps[i].classList.remove('active');
      steps[i].classList.add('done');
      i++;
      if (i < steps.length) {
        steps[i].classList.add('active');
      } else {
        clearInterval(iv);
        const dest = mode === 'affiliate' ? 'done-affiliate.html' : 'done.html';
        location.href = dest + '?mode=' + mode;
      }
    }, 1200);
  </script>
</body>
</html>
